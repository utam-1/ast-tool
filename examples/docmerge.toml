version = 1

# 1. GNU ChangeLog (GCC, GnuCOBOL, Binutils, GDB, etc. — dated, newest first)
[[doc]]
paths = ["ChangeLog", "**/ChangeLog", "ChangeLog*", "**/ChangeLog*"]

  [[doc.level]]
  name  = "entry"
  start = 'date(YYYY-MM-DD) as date ws any as who'
  key   = "header"
  order = "date-desc"

  [[doc.level]]
  name   = "item"
  start  = 'tab "* "'
  key    = "text"
  insert = "bottom"

# 2. GNU Coreutils-style NEWS (2-space indented paragraph items under ** sections)
[[doc]]
paths = ["NEWS.coreutils", "**/coreutils/NEWS"]

  [[doc.level]]
  name   = "release"
  start  = '"* " any as title'
  key    = "header"
  insert = "top"

  [[doc.level]]
  name  = "category"
  start = '"** " any as title'
  key   = "header"

  [[doc.level]]
  name   = "item"
  start  = 'after_blank spaces(2) any'
  key    = "text"
  insert = "bottom"

# 3. GnuCOBOL-style NEWS (outline, no dates)
[[doc]]
paths = ["NEWS", "**/NEWS"]

  [[doc.level]]
  name  = "section"
  start = '"* " any as title'
  key   = "header"

  [[doc.level]]
  name   = "entry"
  start  = '"** " any as title'
  key    = "header"
  insert = "bottom"

# 3. CPython What's New & reStructuredText (.rst)
[[doc]]
paths = ["*.rst", "**/*.rst", "Doc/whatsnew/*.rst", "Misc/NEWS"]

  [[doc.level]]
  name  = "section"
  start = 'underline("=") as title'
  key   = "header"

  [[doc.level]]
  name  = "subsection"
  start = 'underline("-") as title'
  key   = "header"
  order = "alpha-asc"

  [[doc.level]]
  name   = "item"
  start  = '"* " any'
  key    = "text"
  insert = "bottom"

# 4. Keep a Changelog Markdown
[[doc]]
paths = ["CHANGELOG.md", "**/CHANGELOG.md"]

  [[doc.level]]
  name   = "release"
  start  = '"## " any as title'
  key    = "header"
  insert = "top"

  [[doc.level]]
  name  = "category"
  start = '"### " any as title'
  key   = "header"

  [[doc.level]]
  name   = "item"
  start  = '"- " any'
  key    = "text"
  insert = "bottom"
